# HTTP bootstrap; add TLS using the server's ACME certificate manager.
server {
    listen 80;
    server_name exams.eessketit.uz;
    root /var/www/exams.eessketit.uz/current;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location ~ /\. {
        deny all;
    }
}
